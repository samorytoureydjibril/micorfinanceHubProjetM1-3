# ============================================
# SERVEUR
# ============================================
server.port=8088

# ============================================
# EUREKA (Service Discovery)
# ============================================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${random.uuid}

# ============================================
# DATABASE - PostgreSQL
# ============================================
spring.datasource.url=jdbc:postgresql://localhost:5432/microfinance_notification
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:okomothom-96}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

# ============================================
# JPA
# ============================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ============================================
# FLYWAY (Migrations)
# ============================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# ============================================
# RABBITMQ
# ============================================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=/

#  CRITICAL: Ne pas planter si les queues n'existent pas
spring.rabbitmq.listener.simple.missing-queues-fatal=false
spring.rabbitmq.listener.direct.missing-queues-fatal=false

# Queue names
rabbitmq.queue.user-login=user.login.queue
rabbitmq.queue.transaction=transaction.queue
rabbitmq.queue.loan=loan.queue
rabbitmq.queue.account=account.queue
rabbitmq.exchange.notification=notification.exchange

# ============================================
# EMAIL Configuration
# ============================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
app.email.enabled=${EMAIL_ENABLED:false}

# ============================================
# TWILIO SMS (Utiliser variables d'environnement)
# ============================================
twilio.account.sid=${TWILIO_ACCOUNT_SID}
twilio.auth.token=${TWILIO_AUTH_TOKEN}
twilio.phone.number=${TWILIO_PHONE_NUMBER}
app.sms.enabled=${SMS_ENABLED:false}

# ============================================
# SERVICE URLs (Feign Clients)
# ============================================
auth.service.url=http://localhost:8080
client.service.url=http://localhost:8081
loan.service.url=http://localhost:8083
account.service.url=http://localhost:8082
agency.service.url=http://localhost:8086

# ============================================
# INTERNAL API TOKEN
# ============================================
internal.api.token=${INTERNAL_API_TOKEN:my-super-secret-internal-token-2026}

# ============================================
# JWT
# ============================================
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=86400000

# ============================================
# ACTUATOR
# ============================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Désactiver les health checks problématiques
management.health.rabbit.enabled=false
management.health.mail.enabled=false
management.health.redis.enabled=false

# ============================================
# LOGGING
# ============================================
logging.level.com.microfinancehub.micorhub_notification_service=DEBUG
logging.level.org.springframework.amqp=INFO
logging.level.org.springframework.web=WARN

# ============================================
# SCHEDULING
# ============================================
spring.task.scheduling.pool.size=2
spring.task.scheduling.thread-name-prefix=scheduler-

# ============================================
# ASYNC
# ============================================
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=5
spring.task.execution.pool.queue-capacity=50